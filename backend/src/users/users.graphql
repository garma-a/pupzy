"""
Represents a registered Pupzy user.
Created automatically on first Firebase login — no explicit signup required.
"""
type User {
  id: ID!
  email: String!
  """
  Display name — null until the user completes their profile.
  """
  fullName: String
  """
  Arabic display name.
  """
  fullNameArabic: String
  profilePictureUrl: String
  """
  Whether the user has passed additional identity verification
  (set after at least one successful adoption or sale).
  """
  isVerified: Boolean!
  phoneNumber: String
  """
  Whether the user has completed their onboarding profile (phoneNumber + city are both set).
  Always false after the very first login — frontend should redirect to profile-completion screen.
  This is a computed field and is never stored in the database.
  """
  profileComplete: Boolean!
  """
  UUID of the user's home city. Null until the user completes their profile.
  """
  homeCityId: ID
  """
  The user's home city, resolved via DataLoader. Null until completeProfile is called.
  """
  city: City
  """
  Total number of posts across all types.
  """
  postCount: Int!
  """
  Number of RESCUE posts created.
  """
  rescuePostCount: Int!
  """
  Number of LOST posts created.
  """
  lostPostCount: Int!
  """
  Number of ADOPTION posts created.
  """
  adoptionPostCount: Int!
  """
  Number of PRODUCT posts created.
  """
  productPostCount: Int!
  """
  Preferred notification language, explicitly synchronized by the user.
  Null until the user makes an explicit ar/en choice; clients treat null as
  English, because the historic Arabic database default was never a decision.
  """
  languagePreference: String
  """
  Whether push notifications are enabled.
  """
  notificationsEnabled: Boolean!
  """
  Timestamp of the user's most recent authenticated request.
  """
  lastSeenAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""
Input for the completeProfile mutation.
Must be called once after the very first login to unlock full app functionality.
"""
input CompleteProfileInput {
  """
  User's display name. Between 2 and 120 characters.
  """
  fullName: String!
  """
  Phone number in E.164 format (e.g. +201012345678).
  """
  phoneNumber: String!
  """
  UUID of the user's city from the cities table. Optional if location is provided.
  """
  cityId: ID

  """
  GPS coordinates to auto-resolve the nearest city. Optional if cityId is provided.
  """
  location: GeoLocationInput

  """
  Explicit notification language synchronized during onboarding.
  Optional: omitting it leaves the account unsynchronized and English-speaking
  until an explicit choice is made.
  """
  languagePreference: Language
}

"""
Notification language explicitly synchronized by a user.
"""
enum Language {
  ar
  en
}

"""
Input for updating the user's location based on GPS.
"""
input GeoLocationInput {
  latitude: Float!
  longitude: Float!
}

"""
Input for the updateProfile mutation.
Used to update profile details after the profile has been completed.
"""
input UpdateProfileInput {
  """
  User's display name. Between 2 and 120 characters.
  """
  fullName: String!
  """
  Phone number in E.164 format (e.g. +201012345678). Optional — only update if changing.
  """
  phoneNumber: String
}

"""
ISO-8601 date-time string, always in UTC.
"""
scalar DateTime

"""
Status of the account deletion process.
"""
enum AccountDeletionStatus {
  PENDING
  COMPLETED
  FAILED
}

"""
Payload returned when account deletion is requested or its progress queried.
"""
type AccountDeletionPayload {
  status: AccountDeletionStatus!
  deletionId: ID!
  """
  Progress token returned on acceptance. Used to query progress after ordinary auth is blocked.
  """
  progressToken: String
  message: String!
  acceptedAt: DateTime!
  completedAt: DateTime
}

"""
Input for the deleteMyAccount mutation. Requires explicit confirmation.
"""
input DeleteMyAccountInput {
  confirm: Boolean!
  """
  Optional client-supplied progress token (min 16 chars). Enables resilient unauthenticated progress queries even if initial response is dropped.
  """
  progressToken: String
}

type Query {
  """
  Returns the currently authenticated user.
  Requires a valid Firebase Bearer token.
  """
  me: User!

  """
  Checks deletion progress using the scoped deletionId and progressToken.
  Public query — does not require or permit ordinary account access.
  """
  accountDeletionProgress(deletionId: ID!, progressToken: String!): AccountDeletionPayload!
}

type Mutation {
  """
  Completes a user's profile on first login.
  Sets fullName, phoneNumber, and home city.
  Requires authentication.
  """
  completeProfile(input: CompleteProfileInput!): User!

  """
  Updates a user's profile (e.g., changing their display name).
  Requires authentication.
  """
  updateProfile(input: UpdateProfileInput!): User!

  """
  Updates the user's location based on GPS coordinates.
  Automatically resolves the nearest city.
  Requires authentication.
  """
  updateMyLocation(location: GeoLocationInput!): User!

  """
  Sets or replaces the authenticated user's profile photo with an owned upload.
  The `mediaId` must come from `requestProfilePhotoUploadUrl` and may be used
  only once. Replacing queues the previous owned photo for deletion; retrying
  the currently active `mediaId` is idempotent. Provider-owned pictures are
  never deleted as owned objects.
  Requires authentication.
  """
  setProfilePhoto(mediaId: ID!): User!

  """
  Explicitly removes the authenticated user's profile picture.
  Returns the user with no picture, so clients render initials; provider
  synchronization never restores a removed picture. Idempotent.
  Requires authentication.
  """
  removeProfilePhoto: User!

  """
  Explicitly synchronizes the authenticated user's notification language.
  Requires only the chosen language — no unrelated profile field is required.
  Requires authentication.
  """
  updateMyLanguagePreference(languagePreference: Language!): User!

  """
  Updates the authenticated user's push notification preference.
  Disabling push suppresses provider delivery while keeping the in-app inbox
  and notification history intact. Requires only the boolean.
  Requires authentication.
  """
  updateMyNotificationPreferences(notificationsEnabled: Boolean!): User!

  """
  Permanently deletes the authenticated user's Pupzy Account and all associated data.
  Target is derived exclusively from verified authentication.
  Requires authentication within the preceding 5 minutes.
  """
  deleteMyAccount(input: DeleteMyAccountInput!): AccountDeletionPayload!
}

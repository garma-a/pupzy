"""
GPS coordinate pair returned for RESCUE and LOST posts only.
Never returned for ADOPTION, PRODUCT, or MATING — those show city name + distance only.
"""
type GeoLocation {
  latitude: Float!
  longitude: Float!
}

"""
A media item (image) attached to a post.
"""
type PostMedia {
  id: ID!
  """
  Public CDN URL served by Cloudflare R2. Render directly in Flutter Image widget.
  """
  publicUrl: String!
  """
  Render order within the post. 0 = primary thumbnail shown on feed cards.
  """
  displayOrder: Int!
  """
  MIME type of the uploaded file, e.g. 'image/webp'.
  """
  fileContentType: String
  """
  Pixel width — used by Flutter to pre-allocate image placeholder size.
  """
  width: Int
  """
  Pixel height — used by Flutter to pre-allocate image placeholder size.
  """
  height: Int
}

"""
Base post type — all feed and list queries return this shape.
Extension-type-specific fields (RescuePost, LostPost, etc.) are resolved
only on the single-post detail screen via a separate query.
"""
type Post {
  id: ID!
  creator: User!
  postType: PostType!
  title: String!
  description: String!
  status: PostStatus!
  moderationStatus: ModerationStatus!
  """
  Required for RESCUE and LOST. Null for ADOPTION, PRODUCT, and MATING.
  """
  urgency: UrgencyTier
  city: City!
  """
  Human-readable neighborhood, e.g. 'Maadi'. Optional.
  """
  areaName: String
  """
  GPS coordinates. Only returned for RESCUE and LOST posts.
  Null for ADOPTION, PRODUCT, and MATING (city name + distance only).
  """
  coordinates: GeoLocation
  """
  Populated for PRODUCT posts. Null for RESCUE, LOST, ADOPTION.
  Denormalized copy of ProductPost.category for feed queries without joining the extension table.
  """
  marketCategory: ProductCategory
  upvoteCount: Int!
  saveCount: Int!
  viewCount: Int!
  effectiveScore: Float!
  """
  Whether the current viewer has upvoted this post. False if not authenticated.
  """
  isUpvotedByMe: Boolean!
  """
  Whether the current viewer has saved/bookmarked this post. False if not authenticated.
  """
  isSavedByMe: Boolean!
  media: [PostMedia!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""
Extension data for RESCUE posts. Fetched only on the detail screen.
"""
type RescuePost {
  postId: ID!
  species: SpeciesType!
  """
  Free-text condition description, e.g. 'Cat with a broken leg, bleeding from left ear.'
  """
  conditionSummary: String!
  """
  Coordination signal: REPORTING = animal spotted but reporter is gone;
  ON_SITE = reporter is with the animal; CAN_TRANSPORT = reporter can move the animal.
  """
  reporterRole: ReporterRole!
  isLifeThreatening: Boolean!
  hasVisibleSeriousInjury: Boolean!
  isInDangerousLocation: Boolean!
  canAnimalMoveOrEscape: Boolean!
}

"""
Extension data for LOST posts. Fetched only on the detail screen.
Covers both LOST_PET (owner searching) and FOUND_STRAY (reporter found a stray).
"""
type LostPost {
  postId: ID!
  reportType: LostFoundType!
  species: SpeciesType!
  breed: String
  """
  Physical description — e.g. 'Black and white cat with scar on left ear.'
  """
  colorAndMarkings: String
  """
  Whether the animal has a collar with an identification tag.
  """
  hasCollarWithIdentificationTag: Boolean
  """
  Context about how the pet was lost (LOST_PET) or found (FOUND_STRAY).
  """
  circumstances: String
  "LOST_PET only — pet's name if known."
  petName: String
  "LOST_PET only — date the pet was last seen."
  dateLastSeen: String
  "LOST_PET only — pet needs regular medication or has an ongoing medical condition."
  hasMedicalNeeds: Boolean
  "LOST_PET only — pet is elderly or very young."
  isElderlyOrVeryYoung: Boolean
  "LOST_PET only — pet was last seen near a busy road, canal, or hazard."
  lastSeenNearHazard: Boolean
  "FOUND_STRAY only — physical condition of the found animal."
  currentCondition: FoundAnimalCondition
  "FOUND_STRAY only — whether the reporter has the animal in a safe place."
  isCurrentlySafeWithReporter: Boolean
  "FOUND_STRAY only — date the reporter found the animal."
  dateFound: String
}

"""
Extension data for ADOPTION posts. Fetched only on the detail screen.
"""
type AdoptionPost {
  postId: ID!
  petName: String!
  species: SpeciesType!
  breed: String
  """
  Numeric part of age, e.g. 3 (means '3 months'). Null if age unknown.
  """
  ageValue: Int
  """
  Unit for ageValue. Always set when ageValue is set.
  """
  ageUnit: AgeUnit
  gender: GenderType!
  vaccinated: Boolean!
  neutered: Boolean!
  healthNotes: String
  """
  Personality tags describing the pet's temperament.
  """
  personalityTags: [PersonalityTag!]!
  spaceRequirement: SpaceRequirement
  """
  Whether prior experience with this species is required from the adopter.
  """
  priorPetExperienceRequired: Boolean!
  additionalRequirements: String
  """
  Where the pet currently is, e.g. 'Foster home in Maadi'.
  """
  currentlyWith: String
}

"""
Extension data for PRODUCT posts. Fetched only on the detail screen.
"""
type ProductPost {
  postId: ID!
  category: ProductCategory!
  condition: ProductCondition!
  """
  Price in priceCurrency. Null when isFree is true.
  """
  priceAmount: Float
  """
  ISO 4217 currency code. Default 'EGP'.
  """
  priceCurrency: String!
  isFree: Boolean!
  """
  Whether the seller is open to price negotiation.
  """
  openToOffers: Boolean!
}

"""
A contact request for RESCUE, LOST, or ADOPTION posts.
The WhatsApp link is only available when status = APPROVED.
"""
type ContactRequest {
  id: ID!
  postId: ID!
  requester: User!
  """
  Message from the requester explaining why they want to connect.
  """
  message: String!
  status: RequestStatus!
  """
  WhatsApp link (wa.me/...). Only returned when status = APPROVED.
  Built at query time from decrypted phone number — never stored.
  """
  whatsappLink: String
  respondedAt: DateTime
  createdAt: DateTime!
}

"""
An adoption application questionnaire.
Visible only to the applicant and the listing owner.
"""
type AdoptionApplication {
  id: ID!
  targetPostId: ID!
  applicant: User!
  status: RequestStatus!
  speciesPreference: SpeciesType
  breedPreference: String
  agePreference: String
  genderPreference: GenderType
  livingSituation: LivingSituation!
  hasOutdoorAccess: Boolean!
  hasOtherPetsAtHome: Boolean!
  hasChildrenAtHome: Boolean!
  hoursAtHomePerDay: Int
  previousPetExperience: String
  """
  Why the applicant wants to adopt this specific animal. Required.
  """
  whyAdopt: String!
  consentHomeVisit: Boolean!
  canProvideVetReference: Boolean!
  respondedAt: DateTime
  createdAt: DateTime!
}

"""
A content moderation report submitted by a user.
"""
type PostReport {
  id: ID!
  postId: ID!
  reason: ReportReason!
  details: String
  createdAt: DateTime!
}

"""
An in-app notification for the current user.
"""
type Notification {
  id: ID!
  type: NotificationType!
  title: String!
  body: String!
  """
  Related post, if applicable. Null if the post was later deleted.
  """
  relatedPostId: ID
  isRead: Boolean!
  createdAt: DateTime!
}

"""
A saved search alert that fires SYSTEM_ANNOUNCEMENT notifications
when a new matching post is created.
Only ADOPTION and PRODUCT post types are supported.
"""
type SavedSearch {
  id: ID!
  label: String
  postType: PostType!
  cityId: ID
  species: SpeciesType
  breed: String
  marketCategory: ProductCategory
  """
  Maximum price filter. Null means no price ceiling.
  """
  maxPrice: Float
  createdAt: DateTime!
}

# ─── Create Mutation Inputs ──────────────────────────────────────────────────

"""
Input for creating a RESCUE post.
Urgency is required (enforced by chk_posts_urgency_by_type).
Coordinates are returned to clients for Google Maps deep-link.
"""
input CreateRescuePostInput {
  title: String!
  description: String!
  """
  UUID of city from the cities dropdown. Optional if coordinates provided.
  """
  cityId: ID
  """
  GPS coordinates — required. Auto-resolves city if cityId is not provided.
  """
  coordinates: GeoLocationInput!
  """
  Optional neighborhood name, e.g. 'Maadi'.
  """
  areaName: String
  species: SpeciesType!
  """
  Free text condition description, e.g. 'Cat with broken leg, near the school'.
  """
  conditionSummary: String!
  """
  Coordination signal: REPORTING, ON_SITE, or CAN_TRANSPORT.
  """
  reporterRole: ReporterRole!
  """
  Animal's life is in immediate danger.
  """
  isLifeThreatening: Boolean!
  """
  Visible serious injury (heavy bleeding, broken bone, cannot stand).
  """
  hasVisibleSeriousInjury: Boolean!
  """
  Animal is somewhere actively dangerous right now (road, construction, trapped).
  """
  isInDangerousLocation: Boolean!
  """
  Whether the animal can move or flee on its own.
  """
  canAnimalMoveOrEscape: Boolean!
  """
  Media IDs from requestMediaUploadUrl. Max 4.
  """
  mediaIds: [ID!]
}

"""
Input for creating a LOST post (covers both LOST_PET and FOUND_STRAY).
The reportType discriminator determines which fields are required.
"""
input CreateLostPostInput {
  title: String!
  description: String!
  cityId: ID
  coordinates: GeoLocationInput!
  areaName: String
  """
  LOST_PET or FOUND_STRAY — drives field validation.
  """
  reportType: LostFoundType!
  species: SpeciesType!
  breed: String
  """
  Physical description, e.g. 'orange tabby, white paws'.
  """
  colorAndMarkings: String
  """
  Whether the animal has a collar with an identification tag.
  """
  hasCollarWithIdentificationTag: Boolean
  """
  How the pet was lost or how the animal was found.
  """
  circumstances: String
  """
  LOST_PET only — pet's name if known.
  """
  petName: String
  """
  LOST_PET only — date the pet was last seen. ISO date (YYYY-MM-DD).
  """
  dateLastSeen: String
  """
  LOST_PET only — pet needs regular medication or has an ongoing medical condition.
  """
  hasMedicalNeeds: Boolean
  """
  LOST_PET only — pet is elderly or very young.
  """
  isElderlyOrVeryYoung: Boolean
  """
  LOST_PET only — pet was last seen near a busy road, canal, or hazard.
  """
  lastSeenNearHazard: Boolean
  """
  FOUND_STRAY only — physical condition of the found animal.
  """
  currentCondition: FoundAnimalCondition
  """
  FOUND_STRAY only — is the finder currently keeping the animal safe?
  """
  isCurrentlySafeWithReporter: Boolean
  """
  FOUND_STRAY only — date the animal was found. ISO date (YYYY-MM-DD).
  """
  dateFound: String
  """
  Media IDs from requestMediaUploadUrl. Max 4.
  """
  mediaIds: [ID!]
}

"""
Input for creating an ADOPTION post.
No urgency (null for ADOPTION per chk_posts_urgency_by_type).
Coordinates never returned to clients — city name + distance only.
"""
input CreateAdoptionPostInput {
  title: String!
  description: String!
  cityId: ID
  coordinates: GeoLocationInput!
  areaName: String
  petName: String!
  species: SpeciesType!
  breed: String
  """
  Numeric part of age, e.g. 3 (means '3 months'). Must pair with ageUnit.
  """
  ageValue: Int
  """
  Unit for ageValue. Must pair with ageValue.
  """
  ageUnit: AgeUnit
  gender: GenderType!
  vaccinated: Boolean!
  neutered: Boolean!
  healthNotes: String
  """
  Personality tags describing the pet's temperament.
  """
  personalityTags: [PersonalityTag!]
  spaceRequirement: SpaceRequirement
  """
  Whether prior experience with this species is required from the adopter.
  """
  priorPetExperienceRequired: Boolean!
  additionalRequirements: String
  """
  Where the pet currently is, e.g. 'Foster home in Maadi'.
  """
  currentlyWith: String
  """
  Media IDs from requestMediaUploadUrl. Max 4.
  """
  mediaIds: [ID!]
}

"""
Input for creating a PRODUCT post.
No urgency (null for PRODUCT per chk_posts_urgency_by_type).
Coordinates never returned to clients. No upvote button on Market.
"""
input CreateProductPostInput {
  title: String!
  description: String!
  cityId: ID
  coordinates: GeoLocationInput!
  areaName: String
  """
  Product category. Also sets posts.market_category (denormalized).
  """
  category: ProductCategory!
  condition: ProductCondition!
  """
  Required if isFree is false. Null when free (chk_product_price_by_free).
  """
  priceAmount: Float
  """
  ISO 4217 currency code. Defaults to 'EGP'.
  """
  priceCurrency: String
  """
  Enables 'Free / Giveaway' listings. When true, priceAmount must be null.
  """
  isFree: Boolean!
  """
  Shows 'price negotiable' badge on the card.
  """
  openToOffers: Boolean
  """
  Media IDs from requestMediaUploadUrl. Max 4.
  """
  mediaIds: [ID!]
}

"""
Cursor-based pagination info for infinite scroll feeds.
Flutter checks hasNextPage to decide whether to request more.
"""
type PageInfo {
  """
  Opaque cursor pointing to the last item in the current page.
  """
  endCursor: String
  """
  True if more items exist beyond endCursor.
  """
  hasNextPage: Boolean!
}

"""
A paginated edge wrapping a Post with its distance from the viewer.
"""
type PostEdge {
  """
  The post itself.
  """
  node: Post!
  """
  Opaque cursor for this item (used as 'after' in the next request).
  """
  cursor: String!
  """
  Distance in kilometers from the viewer's current location to this post.
  Null if the viewer did not provide their location.
  """
  distanceKm: Float
}

"""
Paginated feed response — Relay-style connection.
"""
type PostConnection {
  edges: [PostEdge!]!
  pageInfo: PageInfo!
}

"""
Viewer's current GPS location for distance calculations and radius filtering.
"""
input ViewerLocationInput {
  latitude: Float!
  longitude: Float!
}

"""
Sort modes for the Adopt Feed.
"""
enum AdoptFeedSort {
  """
  Default. Ranked by engagement-weighted score with time decay.
  """
  HOT
  """
  Newest posts first, ignoring engagement.
  """
  NEWEST
}

"""
Sort modes for the Market Feed.
"""
enum MarketFeedSort {
  """
  Default. Ranked by view+save engagement with time decay.
  """
  HOT
  """
  Newest listings first.
  """
  NEWEST
}

extend type Query {
  """
  Fetch a single post by ID. Returns null if the post does not exist or has been removed.
  """
  post(id: ID!): Post

  """
  Fetch RESCUE extension data for the single-post detail screen.
  Returns null if the post is not of type RESCUE.
  """
  rescuePostDetail(postId: ID!): RescuePost

  """
  Fetch LOST extension data for the single-post detail screen.
  Returns null if the post is not of type LOST.
  """
  lostPostDetail(postId: ID!): LostPost

  """
  Fetch ADOPTION extension data for the single-post detail screen.
  Returns null if the post is not of type ADOPTION.
  """
  adoptionPostDetail(postId: ID!): AdoptionPost

  """
  Fetch PRODUCT extension data for the single-post detail screen.
  Returns null if the post is not of type PRODUCT.
  """
  productPostDetail(postId: ID!): ProductPost

  """
  Help Feed — RESCUE and LOST posts sorted by urgency (CRITICAL first), then newest.
  Filtered by governorate and optional city. Optional radius proximity filter.
  """
  helpFeed(
    """
    Optional. Governorate name to scope results. Omit when filtering by radius from viewerLocation or city center.
    """
    governorate: String
    """
    Optional. Specific city ID within the governorate.
    """
    cityId: ID
    """
    Optional. Viewer's GPS for distance calc and radius filtering.
    """
    viewerLocation: ViewerLocationInput
    """
    Optional. Radius in km for proximity filter. Default 25, max 100.
    """
    radiusKm: Float
    """
    Number of items per page. Default 20, max 50.
    """
    first: Int
    """
    Cursor from previous page's endCursor.
    """
    after: String
  ): PostConnection!

  """
  Adopt Feed — ADOPTION posts ranked by engagement score (HOT) or newest.
  """
  adoptFeed(
    governorate: String
    cityId: ID
    viewerLocation: ViewerLocationInput
    radiusKm: Float
    """
    Sort mode. Default HOT.
    """
    sort: AdoptFeedSort
    first: Int
    after: String
  ): PostConnection!

  """
  Market Feed — PRODUCT posts ranked by engagement score or newest.
  Supports optional category filtering without joining product_posts.
  """
  marketFeed(
    governorate: String
    cityId: ID
    viewerLocation: ViewerLocationInput
    radiusKm: Float
    """
    Optional. Filter by product category.
    """
    category: ProductCategory
    """
    Sort mode. Default HOT.
    """
    sort: MarketFeedSort
    first: Int
    after: String
  ): PostConnection!

  """
  Home Feed — All post types combined, sorted by newest first.
  The main landing screen combining RESCUE, LOST, ADOPTION, PRODUCT, and MATING posts.
  """
  homeFeed(
    governorate: String
    cityId: ID
    viewerLocation: ViewerLocationInput
    radiusKm: Float
    first: Int
    after: String
  ): PostConnection!

  """
  Favorites / Saved Posts — all posts bookmarked by the currently authenticated user,
  ordered by the time of the save action DESC (newest save first).
  """
  mySavedPosts(first: Int, after: String): PostConnection!

  """
  My Posts — all posts created by the currently authenticated user, scoped to
  a specific section (postType) and sorted by newest first (UUIDv7 id DESC).
  """
  myPosts(
    """
    The vertical section to view: RESCUE, LOST, ADOPTION, or PRODUCT.
    """
    postType: PostType!
    first: Int
    after: String
  ): PostConnection!
}

extend type Mutation {
  """
  Create a RESCUE post. Urgency is required.
  Coordinates returned to Flutter for Google Maps deep-link.
  """
  createRescuePost(input: CreateRescuePostInput!): Post!
  """
  Create a LOST/FOUND post. reportType discriminates LOST_PET vs FOUND_STRAY.
  Coordinates returned to Flutter for Google Maps deep-link.
  """
  createLostPost(input: CreateLostPostInput!): Post!
  """
  Create an ADOPTION post. No coordinates returned to clients.
  Contact goes through the contact request approval gate.
  """
  createAdoptionPost(input: CreateAdoptionPostInput!): Post!
  """
  Create a PRODUCT post. No coordinates returned to clients.
  No upvote button on Market. Seller phone decrypted directly.
  """
  createProductPost(input: CreateProductPostInput!): Post!

  """
  Soft-delete a post. Sets status to REMOVED.
  Only the post creator can delete their own post.
  Returns true on success.
  """
  deletePost(postId: ID!): Boolean!

  """
  Toggle upvote on a post (insert if not upvoted, remove if already upvoted).
  Rejected for PRODUCT posts (Market has no upvote button).
  Recalculates effective_score for ADOPTION posts.
  Returns the updated post with new upvoteCount.
  """
  toggleUpvote(postId: ID!): Post!

  """
  Toggle save/bookmark on a post (insert if not saved, remove if already saved).
  Works on all 4 post types. On PRODUCT acts as buyer wishlist.
  Recalculates effective_score for ADOPTION and PRODUCT posts.
  Returns the updated post with new saveCount.
  """
  toggleSave(postId: ID!): Post!

  """
  Update a post's lifecycle status.
  Allowed transitions depend on post type:
    RESCUE  → RESOLVED
    LOST    → REUNITED
    ADOPTION → ADOPTED
    PRODUCT  → SOLD
  Only the post creator can change their own post's status.
  """
  updatePostStatus(postId: ID!, status: PostStatus!): Post!

  """
  Records a view on a post. Deduplicated per user per hour.
  Fire-and-forget from Flutter — always returns true.
  """
  recordView(postId: ID!): Boolean!
}

info:
  name: firebase_token_email_password
  type: http
  seq: 1

http:
  method: POST
  url: 'https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key={{FirebaseWebApiKey}}'
  params:
    - name: key
      value: '{{FirebaseWebApiKey}}'
      type: query
  body:
    type: json
    data: |-
      {
        "email": "{{TestEmail}}",
        "password": "{{TestPassword}}",
        "returnSecureToken": true
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

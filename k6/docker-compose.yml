version: '3.8'

# Monitoring stack for k6 soak / load test time-series visualization.
#
# Start before running soak.js:
#   docker compose up -d
#
# Then run k6 with InfluxDB output:
#   k6 run --env BASE_URL=https://your-test.railway.app \
#          --out influxdb=http://localhost:8086/k6 \
#          k6/soak.js
#
# Grafana is at http://localhost:3001
#   User: admin  Password: (anonymous access enabled)
#   Import dashboard ID 2587 from grafana.com (official k6 dashboard)
#
# InfluxDB is at http://localhost:8086 (database: k6)

services:
  influxdb:
    image: influxdb:1.8
    container_name: pupzy_k6_influxdb
    ports:
      - '8086:8086'
    environment:
      INFLUXDB_DB:                  k6
      INFLUXDB_HTTP_AUTH_ENABLED:   'false'
    volumes:
      - influxdb_data:/var/lib/influxdb
    healthcheck:
      test:     ['CMD', 'influx', '-execute', 'SHOW DATABASES']
      interval: 10s
      timeout:  5s
      retries:  5

  grafana:
    image: grafana/grafana:latest
    container_name: pupzy_k6_grafana
    ports:
      - '3001:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED:  'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      # Pre-configure the InfluxDB data source
      GF_DATASOURCES_DEFAULT_NAME: InfluxDB
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      influxdb:
        condition: service_healthy

volumes:
  influxdb_data:
  grafana_data:
